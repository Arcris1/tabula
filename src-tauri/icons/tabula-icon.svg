<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Branded tile gradient: blue -> indigo (matches the app's blue-600 accent) -->
    <linearGradient id="tile" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Soft top sheen -->
    <linearGradient id="sheen" x1="512" y1="100" x2="512" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#0b1220" flood-opacity="0.35"/>
    </filter>
    <!-- Clip so the amber header respects the card's rounded top corners -->
    <clipPath id="cardClip">
      <rect x="282" y="250" width="460" height="524" rx="46" ry="46"/>
    </clipPath>
  </defs>

  <!-- App tile (squircle-ish rounded rect with transparent corners) -->
  <rect x="96" y="96" width="832" height="832" rx="196" ry="196" fill="url(#tile)"/>
  <rect x="96" y="96" width="832" height="832" rx="196" ry="196" fill="url(#sheen)"/>

  <!-- Table card -->
  <g filter="url(#cardShadow)">
    <rect x="282" y="250" width="460" height="524" rx="46" ry="46" fill="#f8fafc"/>
  </g>

  <g clip-path="url(#cardClip)">
    <!-- Header row (amber, nods to the connection accent color) -->
    <rect x="282" y="250" width="460" height="132" fill="#f59e0b"/>
    <!-- Selected body row highlight (light blue) -->
    <rect x="282" y="514" width="460" height="130" fill="#dbeafe"/>

    <!-- Column dividers -->
    <g stroke="#94a3b8" stroke-width="9" stroke-linecap="round">
      <line x1="435" y1="382" x2="435" y2="774"/>
      <line x1="589" y1="382" x2="589" y2="774"/>
    </g>
    <!-- Row dividers -->
    <g stroke="#cbd5e1" stroke-width="9" stroke-linecap="round">
      <line x1="282" y1="514" x2="742" y2="514"/>
      <line x1="282" y1="644" x2="742" y2="644"/>
    </g>
    <!-- Header cell ticks (subtle white marks suggesting column labels) -->
    <g fill="#ffffff" opacity="0.9">
      <rect x="322" y="303" width="72" height="26" rx="13"/>
      <rect x="476" y="303" width="72" height="26" rx="13"/>
      <rect x="630" y="303" width="72" height="26" rx="13"/>
    </g>
  </g>

  <!-- Card outline for crispness -->
  <rect x="282" y="250" width="460" height="524" rx="46" ry="46" fill="none" stroke="#0b1220" stroke-opacity="0.08" stroke-width="4"/>
</svg>
